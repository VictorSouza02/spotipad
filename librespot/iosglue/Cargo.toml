[package]
name = "iosglue"
version = "0.0.0"
edition = "2021"
[lib]
crate-type = ["staticlib"]
[dependencies]
librespot-core = { path = "../core", version = "0.6.0" }
librespot-protocol = { path = "../protocol", version = "0.6.0" }
protobuf = "3.5"
data-encoding = "2"
librespot-playback = { path = "../playback", version = "0.6.0", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
bytes = "1"
futures-util = "0.3"
rand = "0.8"
http = "1"
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false }
rustls-rustcrypto = "0.0.2-alpha"
serde_json = "1"
env_logger = "0.10"
log = "0.4"
url = "2"
zeroize = "=1.7.0"
zeroize_derive = "=1.4.2"
